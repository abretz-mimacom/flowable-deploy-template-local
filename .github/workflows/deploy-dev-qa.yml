name: Deploy Flowable Platform

# NOTE: this workflow is the opt-in CI/CD demo. It only does anything if you've
# installed the actions-runner-controller (ARC) self-hosted runner locally
# (see scripts/add-github-action-runner.sh, gated behind DISABLE_ARC in
# create-env.sh). The default local getting-started path in the README does
# not require this - it deploys via ./create-env.sh directly.

on:
  push:
    branches:
      - dev
      - main
      - release/*
    tags:
      - 'v*.*.*'

jobs:

  deploy-dev:
    runs-on: [self-hosted, local] # only runs on the local self-hosted runner (see scripts/add-github-action-runner.sh)
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && contains(github.ref, 'refs/heads/release/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Kubectl and helm
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'
      - name: Show cluster nodes (in-cluster auth)
        run: |
          API="https://kubernetes.default.svc"
          TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          kubectl --server="${API}" --token="${TOKEN}" --certificate-authority="${CA}" get pods -A
      - name: Run deploy-flowable-platform.sh for dev
        run: |
          cd $GITHUB_WORKSPACE
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          git submodule update --init --recursive
          sudo chmod a+x $GITHUB_WORKSPACE/scripts/*
          source "$GITHUB_WORKSPACE/scripts/deploy-flowable-platform.sh" "dev" "flowable"
        env:
          FLOWABLE_LICENSE_KEY: ${{ secrets.FLOWABLE_LICENSE_KEY }}
          FLOWABLE_REPO_USER: ${{ secrets.FLOWABLE_REPO_USER }}
          FLOWABLE_REPO_PASSWORD: ${{ secrets.FLOWABLE_REPO_PASSWORD }}

  deploy-test:
    runs-on: [self-hosted, local]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && github.ref == 'refs/heads/dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Kubectl and helm
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'
      - name: Show cluster nodes (in-cluster auth)
        run: |
          API="https://kubernetes.default.svc"
          TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          kubectl --server="${API}" --token="${TOKEN}" --certificate-authority="${CA}" get pods -A
      - name: Run deploy-flowable-platform.sh for test
        run: |
          cd $GITHUB_WORKSPACE
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          git submodule update --init --recursive
          sudo chmod a+x $GITHUB_WORKSPACE/scripts/*
          source "$GITHUB_WORKSPACE/scripts/deploy-flowable-platform.sh" "test" "flowable"
        env:
          FLOWABLE_LICENSE_KEY: ${{ secrets.FLOWABLE_LICENSE_KEY }}
          FLOWABLE_REPO_USER: ${{ secrets.FLOWABLE_REPO_USER }}
          FLOWABLE_REPO_PASSWORD: ${{ secrets.FLOWABLE_REPO_PASSWORD }}

  deploy-stg:
    runs-on: [self-hosted, local]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Kubectl and helm
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'
      - name: Show cluster nodes (in-cluster auth)
        run: |
          API="https://kubernetes.default.svc"
          TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          kubectl --server="${API}" --token="${TOKEN}" --certificate-authority="${CA}" get pods -A
      - name: Run deploy-flowable-platform.sh for stg
        run: |
          cd $GITHUB_WORKSPACE
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          git submodule update --init --recursive
          sudo chmod a+x $GITHUB_WORKSPACE/scripts/*
          source "$GITHUB_WORKSPACE/scripts/deploy-flowable-platform.sh" "stg" "flowable"
        env:
          FLOWABLE_LICENSE_KEY: ${{ secrets.FLOWABLE_LICENSE_KEY }}
          FLOWABLE_REPO_USER: ${{ secrets.FLOWABLE_REPO_USER }}
          FLOWABLE_REPO_PASSWORD: ${{ secrets.FLOWABLE_REPO_PASSWORD }}

  deploy-prod:
    runs-on: [self-hosted, local]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name != '' && github.ref_type == 'tag' && github.event.base_ref == 'refs/heads/main' }}
    steps:
      - name: Dummy step
        id: dummy-step
        run: echo "This is a dummy job because this env doesn't have a true 'prod' deployment because of resource constraints in the demo env."
