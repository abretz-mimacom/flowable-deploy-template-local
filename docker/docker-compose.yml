services: 
  flowable-index:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    restart: always
    environment:
      discovery.type: single-node
      node.name: flowable-node-01
      cluster.name: flowable-cluster
      xpack.security.enabled: "false"
    ports:
      - "9300:9300"
      - "9200:9200"
    volumes:
      - data_index:/usr/share/elasticsearch/data
    # networks:
    #   - flowable-index
    deploy:
      resources:
        limits:
          cpus: '0.50'     # Max 50% of a single CPU core
          memory: 4096M     # Hard limit: container is killed if exceeded
        reservations:
          cpus: '0.25'     # Guaranteed minimum CPU
          memory: 2048M     # Soft limit: guaranteed RAM

  flowable-db:
    image: postgres:16.3
    restart: always
    ports:
      - 5432:5432
    volumes:
      - data_db:/var/lib/postgresql/data
      - ./postgresql/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    environment:
      - POSTGRES_MULTIPLE_DATABASES=dev_work,dev_control,dev_design,test_work,test_control,stg_work,stg_control
      - POSTGRES_DB=flowable
      - POSTGRES_USER=flowable
      - POSTGRES_PASSWORD=flowable
    deploy:
      resources:
        limits:
          cpus: '0.5'     # Max 50% of a single CPU core
          memory: 512M     # Hard limit: container is killed if exceeded
          pids: 100        # Max number of processes/threads
        reservations:
          cpus: '0.25'     # Guaranteed minimum CPU
          memory: 128M     # Soft limit: guaranteed RAM
    # networks:
    #   - flowable-db


  flowable-openldap:
    image: osixia/openldap:1.5.0
    restart: always
    command: --loglevel info
    environment:
      LDAP_ORGANISATION: Flowable
      LDAP_DOMAIN: flowable.local
      LDAP_BASE_DN: "dc=flowable,dc=local"
      LDAP_ADMIN_PASSWORD: admin
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - data_ldap:/var/lib/ldap
      - data_slapd:/etc/ldap/slapd.d
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "389:389"

  # Optional web UI for browsing/debugging the LDAP directory: http://localhost:9096
  flowable-phpldapadmin:
    image: osixia/phpldapadmin:latest
    restart: always
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: flowable-openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "9096:80"
    depends_on:
      - flowable-openldap

  # Keeps its own DB (rather than the shared flowable-db) so it stays fully
  # decoupled from the per-namespace Postgres databases above.
  flowable-keycloak-db:
    image: postgres:16.3
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - data_keycloak_db:/var/lib/postgresql/data

  # Backs stg's GitHub-OAuth2 demo login: federates the flowableAdministrator/
  # flowableUser LDAP groups above and exposes them as flowable-work/
  # flowable-control OIDC clients (see docker/keycloak/flowable-realm.json).
  flowable-keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: always
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://flowable-keycloak-db:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "9095"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "9095:8080"
    depends_on:
      - flowable-keycloak-db
      - flowable-openldap
    volumes:
      - ./keycloak/flowable-realm.json:/opt/keycloak/data/import/flowable-realm.json:ro

volumes:
  data_db:
  data_index:
  data_ldap:
  data_slapd:
  data_keycloak_db:

