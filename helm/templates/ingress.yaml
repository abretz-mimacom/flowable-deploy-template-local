{{- if not .Values.flowable.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowable-ingress
spec:
  ingressClassName: traefik
  rules:
  - host:  # blank: routed by path prefix only, works for localhost or any host
    http:
      paths:
      - path: {{ printf "/%s/design" .Release.Namespace | quote }}
        pathType: Prefix
        backend:
          service:
            name: flowable-design
            port:
              name: http
      - path: {{ printf "/%s/work" .Release.Namespace | quote }}
        pathType: Prefix
        backend:
          service:
            name: flowable-work
            port:
              name: http
      - path: {{ printf "/%s/control" .Release.Namespace | quote }}
        pathType: Prefix
        backend:
          service:
            name: flowable-control
            port:
              name: http
{{- end }}