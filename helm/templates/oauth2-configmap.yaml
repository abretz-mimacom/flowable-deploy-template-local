apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-generic-config
data:
  spring.security.oauth2.client.registration.github.client-id: ${GITHUB_OAUTH_CLIENT_ID}
  spring.security.oauth2.client.registration.github.client-secret: ${GITHUB_OAUTH_CLIENT_SECRET}
  spring.security.oauth2.client.registration.github.client-name: flowable-stg
  spring.security.oauth2.client.registration.github.scope: "read:user,user:email,read:project"
  spring.security.oauth2.client.provider.github.user-name-attribute: login