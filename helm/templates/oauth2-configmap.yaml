# stg's OAuth2 login backend: a local Keycloak instance (docker-compose),
# federating LDAP groups (see docker/keycloak/flowable-realm.json). Two
# ConfigMaps since flowable-work and flowable-control are each their own
# Keycloak client. The secrets here are fixed local-demo values baked into
# the realm import - not sensitive, never leave localhost.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-work-config
data:
  spring.security.oauth2.client.registration.keycloak.client-id: flowable-work
  spring.security.oauth2.client.registration.keycloak.client-secret: flowable-work-secret
  spring.security.oauth2.client.registration.keycloak.client-name: flowable-stg
  spring.security.oauth2.client.registration.keycloak.scope: "openid,profile,email"
  spring.security.oauth2.client.registration.keycloak.authorization-grant-type: authorization_code
  spring.security.oauth2.client.provider.keycloak.authorization-uri: http://localhost:9095/realms/flowable/protocol/openid-connect/auth
  spring.security.oauth2.client.provider.keycloak.token-uri: http://docker-flowable-keycloak-1:8080/realms/flowable/protocol/openid-connect/token
  spring.security.oauth2.client.provider.keycloak.user-info-uri: http://docker-flowable-keycloak-1:8080/realms/flowable/protocol/openid-connect/userinfo
  spring.security.oauth2.client.provider.keycloak.jwk-set-uri: http://docker-flowable-keycloak-1:8080/realms/flowable/protocol/openid-connect/certs
  spring.security.oauth2.client.provider.keycloak.user-name-attribute: preferred_username
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-control-config
data:
  spring.security.oauth2.client.registration.keycloak.client-id: flowable-control
  spring.security.oauth2.client.registration.keycloak.client-secret: flowable-control-secret
  spring.security.oauth2.client.registration.keycloak.client-name: flowable-stg
  spring.security.oauth2.client.registration.keycloak.scope: "openid,profile,email"
  spring.security.oauth2.client.registration.keycloak.authorization-grant-type: authorization_code
  spring.security.oauth2.client.provider.keycloak.authorization-uri: http://localhost:9095/realms/flowable/protocol/openid-connect/auth
  spring.security.oauth2.client.provider.keycloak.token-uri: http://docker-flowable-keycloak-1:8080/realms/flowable/protocol/openid-connect/token
  spring.security.oauth2.client.provider.keycloak.user-info-uri: http://docker-flowable-keycloak-1:8080/realms/flowable/protocol/openid-connect/userinfo
  spring.security.oauth2.client.provider.keycloak.jwk-set-uri: http://docker-flowable-keycloak-1:8080/realms/flowable/protocol/openid-connect/certs
  spring.security.oauth2.client.provider.keycloak.user-name-attribute: preferred_username
